name: CI

# Kvalitetsgrind. Fyra jobb:
#   grindar — lint, typkontroll, kontroll av att den incheckade artefakten (bygget stoppar vid mojibake)
#             faktiskt motsvarar källan och att ett andra bygge i en annan katalog blir samma fil.
#   tester  — hela testsviten, delad på fyra parallella jobb (Vitests --shard). Varje testfil körs
#             i exakt ett av dem; tillsammans är de `npm run test:full`.
#   quality — grön först när grindar och alla fyra delar av tester är gröna. Det är den kontroll
#             som regeln för main kräver, så namnet står kvar.
#   browser — röktest av den byggda single-file-filen i riktig Chromium, Firefox och WebKit.
#             Diagrammen (diagramkärnan på D3, ADR-39) ritas med äkta D3 också i
#             jsdom-testerna; här prövas PNG-exporten, som kräver en riktig canvas,
#             och att allt fungerar under CSP:n från file://.
#
# push körs bara på main (och versionstaggar); andra grenar prövas via sin pull request.
# Annars körde varje push på en PR-gren hela sviten två gånger samtidigt (push +
# pull_request). En gren utan pull request kan köras för hand med workflow_dispatch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# En körning åt gången per pull request (eller ref). En ny push på en pull request avbryter
# den pågående körningen, vars resultat ändå är inaktuellt; på main och taggar får varje
# körning gå klart.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Bara läsbehörighet: jobben checkar ut och testar, men skriver ingenting till repot.
permissions:
  contents: read

# Stegen är låsta på commit-SHA (versionen står som kommentar), så att en flyttad tagg hos
# tredjepartsåtgärden inte kan ändra vad som körs. Uppdatera SHA och kommentar tillsammans.
jobs:
  grindar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 krävs: jsdom-kedjan (html-encoding-sniffer → @exodus/bytes)
      # gör require() av en ES-modul, vilket kastar ERR_REQUIRE_ESM på Node 20.
      # Med Node 20 föll smoke-, a11y- och golden-sviterna tyst (endast 183 av
      # 286 tester kördes). require(esm) är påslaget från och med Node 22.12.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install (deterministiskt)
        run: npm ci

      - name: Lint (inga errors tillåtna)
        run: npm run lint

      # JSDoc-typkontroll med tsc i checkJs-läge (tsconfig.json: src/lib + tools, tsconfig.app.json: src/app
      # som ett gemensamt globalt scope). Nolläge: varje nytt fel stoppar bygget.
      - name: Typkontroll (tsc --checkJs, noll fel)
        run: npm run typecheck

      # Bygget är reproducerbart (ingen tidsstämpel i bannern), så en färsk build måste bli byte-identisk
      # med den incheckade artefakten och RELEASE.txt. Grinden är den enda kontrollen av det som bygget skriver i
      # dist/ och av den genererade src/app/08-version.js: version, kontrollsumma och esbuild-bygget prövas inte en
      # gång till i testsviten.
      - name: Artefakten motsvarar källan (byte-identisk)
        run: |
          fore=$(sha256sum dist/oppen-lonekartlaggning.html | cut -d' ' -f1)
          npm run bundle
          efter=$(sha256sum dist/oppen-lonekartlaggning.html | cut -d' ' -f1)
          if [ "$fore" != "$efter" ] || ! git diff --quiet -- dist src/app/08-version.js; then
            echo "::error::Den incheckade artefakten, RELEASE.txt eller src/app/08-version.js motsvarar inte källan."
            echo "  incheckad: $fore"
            echo "  ombyggd:   $efter"
            git diff --stat -- dist src/app/08-version.js
            echo "Kör 'npm run bundle' och committa resultatet."
            exit 1
          fi
          echo "Artefakten och RELEASE.txt är byte-identiska med en färsk build ($fore)."

      # Reproducerbart bygge (ADR-101): samma commit byggd i en annan katalog, med annan tidszon och annat språk,
      # ska ge samma fil. Fångar det som artefaktgrinden ovan inte ser, eftersom den bygger i samma katalog.
      - name: Bygget är reproducerbart (annan katalog, tidszon och språk)
        run: |
          git worktree add --detach "$RUNNER_TEMP/andra-bygget" HEAD
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/andra-bygget/node_modules"
          (cd "$RUNNER_TEMP/andra-bygget" && TZ=Pacific/Kiritimati LC_ALL=C npm run bundle)
          forsta=$(sha256sum dist/oppen-lonekartlaggning.html | cut -d' ' -f1)
          andra=$(sha256sum "$RUNNER_TEMP/andra-bygget/dist/oppen-lonekartlaggning.html" | cut -d' ' -f1)
          if [ "$forsta" != "$andra" ]; then
            echo "::error::Två byggen ur samma commit gav olika filer ($forsta, $andra)."
            exit 1
          fi
          echo "Två byggen ur samma commit gav samma fil ($forsta)."

  # Hela sviten tar omkring tolv minuter i ett jobb, eftersom CI-maskinen har få kärnor. Delad på
  # fyra jobb körs samma tester parallellt. Vitest fördelar filerna efter sökvägen,
  # så en ny testfil hamnar i en del utan att listas. fail-fast är av, så att varje del rapporterar
  # sina fel också när en annan del har fallit.
  tester:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        del: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22.12 eller senare krävs, se jobbet grindar.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install (deterministiskt)
        run: npm ci

      - name: Testsviten (Vitest, del ${{ matrix.del }} av 4)
        run: npm run test:full -- --shard=${{ matrix.del }}/4

  # Samlar grindarna och sviten i en kontroll. always() gör att jobbet körs, och faller, också när
  # ett jobb det väntar på har fallit eller avbrutits; annars hoppades det över, och en överhoppad
  # kontroll räknas som godkänd av regeln för main.
  quality:
    if: always()
    needs: [grindar, tester]
    runs-on: ubuntu-latest
    steps:
      - name: Grindarna och alla delar av sviten är gröna
        env:
          GRINDAR: ${{ needs.grindar.result }}
          TESTER: ${{ needs.tester.result }}
        run: |
          echo "grindar: $GRINDAR, tester: $TESTER"
          [ "$GRINDAR" = "success" ] && [ "$TESTER" = "success" ]

  # Samma röktest i de tre webbläsarmotorer som verktyget stöder (Chrome/Edge, Firefox,
  # Safari). WebKit kräver systembibliotek som bara finns färdiga på Ubuntu, så det körs här.
  # Pull requests, main och manuella körningar kör alla tre; en push av en versionstagg kör
  # bara Chromium (taggen har redan prövats i alla tre på main).
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install (deterministiskt)
        run: npm ci

      - name: Installera ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Byggs om här i stället för att lita på den incheckade filen: efter en
      # git-checkout har alla filer samma tidsstämpel, och röktestets
      # färskhetsspärr jämför mtime mot källan.
      - name: Bygg single-file-artefakten
        run: npm run bundle

      - name: Röktest i riktig webbläsare (${{ matrix.browser }})
        run: node tools/browser-smoke.mjs --browser=${{ matrix.browser }}
