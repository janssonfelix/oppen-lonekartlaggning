name: CI

# Kvalitetsgrind. Två jobb:
#   quality — lint, typkontroll, mojibake-skydd, kontroll av att den incheckade artefakten
#             faktiskt motsvarar källan och sist hela testsviten.
#   browser — röktest av den byggda single-file-filen i riktig Chromium, Firefox och WebKit.
#             Diagrammen (diagramkärnan på D3, ADR-39) ritas med äkta D3 också i
#             jsdom-testerna; här prövas PNG-exporten, som kräver en riktig canvas,
#             och att allt fungerar under CSP:n från file://.
#
# push körs bara på main (och versionstaggar); andra grenar prövas via sin pull request.
# Annars körde varje push på en PR-gren hela sviten två gånger samtidigt (push +
# pull_request). En gren utan pull request kan köras för hand med workflow_dispatch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# En körning åt gången per pull request (eller ref). En ny push på en pull request avbryter
# den pågående körningen, vars resultat ändå är inaktuellt; på main och taggar får varje
# körning gå klart.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Bara läsbehörighet: jobben checkar ut och testar, men skriver ingenting till repot.
permissions:
  contents: read

# Stegen är låsta på commit-SHA (versionen står som kommentar), så att en flyttad tagg hos
# tredjepartsåtgärden inte kan ändra vad som körs. Uppdatera SHA och kommentar tillsammans.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 krävs: jsdom-kedjan (html-encoding-sniffer → @exodus/bytes)
      # gör require() av en ES-modul, vilket kastar ERR_REQUIRE_ESM på Node 20.
      # Med Node 20 föll smoke-, a11y- och golden-sviterna tyst (endast 183 av
      # 286 tester kördes). require(esm) är påslaget från och med Node 22.12.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install (deterministiskt)
        run: npm ci

      - name: Lint (inga errors tillåtna)
        run: npm run lint

      # JSDoc-typkontroll med tsc i checkJs-läge (tsconfig.json: src/lib + tools, tsconfig.app.json: src/app
      # som ett gemensamt globalt scope). Nolläge: varje nytt fel stoppar bygget.
      - name: Typkontroll (tsc --checkJs, noll fel)
        run: npm run typecheck

      - name: Teckenkodningsgrind (ingen U+FFFD i egen källkod)
        run: |
          node -e "const fs=require('fs');let bad=false;for(const f of ['dist/app.js','src/index.html','src/style.css']){if(fs.readFileSync(f,'utf8').includes('�')){console.error('U+FFFD (mojibake) i '+f);bad=true;}}if(bad)process.exit(1);console.log('Ingen mojibake i källfilerna.');"

      # Bygget är reproducerbart (ingen tidsstämpel i bannern), så en färsk
      # build måste bli byte-identisk med den incheckade artefakten. Utan detta
      # kan källan ändras utan att den skeppade HTML-filen byggs om —
      # appsource-testet vaktar dist/app.js, men ingenting vaktade bundlen.
      - name: Artefakten motsvarar källan (byte-identisk)
        run: |
          fore=$(sha256sum dist/oppen-lonekartlaggning.html | cut -d' ' -f1)
          npm run bundle
          efter=$(sha256sum dist/oppen-lonekartlaggning.html | cut -d' ' -f1)
          if [ "$fore" != "$efter" ]; then
            echo "::error::Den incheckade artefakten motsvarar inte källan."
            echo "  incheckad: $fore"
            echo "  ombyggd:   $efter"
            echo "Kör 'npm run bundle' och committa resultatet."
            exit 1
          fi
          echo "Artefakten är byte-identisk med en färsk build ($fore)."

      # Sist, eftersom den tar längst tid (omkring tolv minuter): de billiga grindarna ovan
      # ska kunna fälla en push innan sviten ens startat.
      - name: Testsviten (Vitest, hela)
        run: npm run test:full

  # Samma röktest i de tre webbläsarmotorer som verktyget stöder (Chrome/Edge, Firefox,
  # Safari). WebKit kräver systembibliotek som bara finns färdiga på Ubuntu, så det körs här.
  # Pull requests, main och manuella körningar kör alla tre; en push av en versionstagg kör
  # bara Chromium (taggen har redan prövats i alla tre på main).
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install (deterministiskt)
        run: npm ci

      - name: Installera ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Byggs om här i stället för att lita på den incheckade filen: efter en
      # git-checkout har alla filer samma tidsstämpel, och röktestets
      # färskhetsspärr jämför mtime mot källan.
      - name: Bygg single-file-artefakten
        run: npm run bundle

      - name: Röktest i riktig webbläsare (${{ matrix.browser }})
        run: node tools/browser-smoke.mjs --browser=${{ matrix.browser }}
