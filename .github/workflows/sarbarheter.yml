name: Sårbarheter

# Bevakar de fyra biblioteken i vendor/ mot kända sårbarheter. Dependabot ser bara package.json och
# arbetsflödenas steg, inte vendor/, så utan det här jobbet får biblioteken i den byggda filen ingen avisering.
#   1. programvaruförteckningen byggs ur vendor/ (tools/sbom.mjs → dist/sbom.cdx.json, CycloneDX med purl);
#   2. tools/sarbarheter-hamta.mjs frågar den öppna sårbarhetsdatabasen OSV (api.osv.dev) om varje bibliotek, med
#      bara paketets namn, ekosystem och version, och skriver svaret som JSON; en fråga som misslyckas fäller steget
#      med beskedet att databasen inte kunde frågas;
#   3. tools/sarbarheter.mjs bedömer svaret och faller om ett bibliotek inte prövades eller om något har en känd
#      sårbarhet (utom de åtgärdade som står i skriptet, med skäl).
#
# Inget tredjepartssteg: repot tillåter bara GitHubs egna actions (och cosign-installeraren i release.yml), så
# frågan mot OSV görs av ett eget Node-skript utan beroenden i stället för en färdig skanner.
#
# Ett eget arbetsflöde, inte ett jobb i ci.yml: det körs på schema och på andra sökvägar än CI, och ett fynd i
# databasen (som kan komma utan att koden ändrats) ska synas som ett eget fallet arbetsflöde utan att CI-kontrollen
# för main blir röd. Ett fynd på schemat syns som en fallen körning; GitHub aviserar den som senast ändrade schemat.
#
# Bara CI hämtar något från nätet; verktyget självt (HTML-filen) gör fortfarande inga nätverksanrop.
on:
  schedule:
    - cron: '17 4 * * 1'   # måndagar 04.17 UTC
  push:
    branches: [main]
    paths:
      - 'vendor/**'
      - 'tools/sbom.mjs'
      - 'tools/sarbarheter.mjs'
      - 'tools/sarbarheter-hamta.mjs'
      - 'TREDJEPARTSLICENSER.md'
      - '.github/workflows/sarbarheter.yml'
  pull_request:
    paths:
      - 'vendor/**'
      - 'tools/sbom.mjs'
      - 'tools/sarbarheter.mjs'
      - 'tools/sarbarheter-hamta.mjs'
      - 'TREDJEPARTSLICENSER.md'
      - '.github/workflows/sarbarheter.yml'
  workflow_dispatch:

# Bara läsbehörighet och inga hemligheter: jobbet checkar ut, frågar OSV och skriver ingenting till repot.
permissions:
  contents: read

# Stegen är låsta på commit-SHA (versionen står som kommentar), så att en flyttad tagg inte kan ändra vad som
# körs. Uppdatera SHA och kommentar tillsammans.
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skripten använder bara Node:s inbyggda moduler (och dess fetch), så maskinens Node räcker och npm ci behövs inte.
      - name: Programvaruförteckning (SBOM)
        run: node tools/sbom.mjs

      - name: Fråga OSV om biblioteken i förteckningen
        run: node tools/sarbarheter-hamta.mjs dist/sbom.cdx.json dist/osv-svar.json

      - name: Bedöm svaret
        run: node tools/sarbarheter.mjs dist/osv-svar.json
