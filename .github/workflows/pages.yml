name: Demosidan

# Publicerar demosidan (site/dist/, byggd av tools/site.mjs ur site/index.html och det incheckade bygget) på
# GitHub Pages när en version taggas, eller för hand. Sidan är statisk, utan skript, och är till för påhittad
# data: verklig lönedata läses bara in i en nedladdad och verifierad fil (SECURITY.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

# En publicering i taget; en pågående avbryts inte, så att sidan aldrig står halvt utbytt.
concurrency:
  group: pages
  cancel-in-progress: false

# Stegen är låsta på commit-SHA (versionen står som kommentar), så att en flyttad tagg hos
# tredjepartsåtgärden inte kan ändra vad som körs. Uppdatera SHA och kommentar tillsammans.
jobs:
  bygg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Guiderna visas som Markdown i repot på GitHub.
      - name: Bygg demosidan
        env:
          GUIDE_URL: https://github.com/${{ github.repository }}/blob/main/docs/anvandare/
        run: node tools/site.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist/

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publicera på GitHub Pages
      id-token: write   # Pages kräver OIDC-token för att styrka var artefakten kommer ifrån
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      - id: publicering
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
